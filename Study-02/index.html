<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-top">
        <h1 class="app-title">할 일 관리</h1>
        <p class="today-date" id="todayDate">2026년 9월 9일 수요일</p>
      </div>
      <div class="progress-section">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 33%"></div>
        </div>
        <p class="progress-text" id="progressText">1/3 완료 · 33%</p>
        <div class="category-progress" id="categoryProgress">
          <span class="category-progress-item category-progress-item--work" id="progressWork">업무 0/0</span>
          <span class="category-progress-item category-progress-item--personal" id="progressPersonal">개인 0/0</span>
          <span class="category-progress-item category-progress-item--study" id="progressStudy">공부 0/0</span>
        </div>
      </div>
    </header>

    <section class="input-section" aria-label="할 일 추가">
      <form id="addForm" class="add-form">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <div class="category-select" role="radiogroup" aria-label="카테고리 선택">
          <label class="category-option category-option--work">
            <input type="radio" name="category" value="work" />
            <span>업무</span>
          </label>
          <label class="category-option category-option--personal">
            <input type="radio" name="category" value="personal" checked />
            <span>개인</span>
          </label>
          <label class="category-option category-option--study">
            <input type="radio" name="category" value="study" />
            <span>공부</span>
          </label>
        </div>
        <button type="submit" id="addBtn" class="add-btn">추가</button>
      </form>
    </section>

    <nav class="filter-section" aria-label="필터">
      <button type="button" class="filter-btn is-active" data-filter="all">전체</button>
      <button type="button" class="filter-btn" data-filter="work">업무</button>
      <button type="button" class="filter-btn" data-filter="personal">개인</button>
      <button type="button" class="filter-btn" data-filter="study">공부</button>
    </nav>

    <main class="list-section">
      <ul id="todoList" class="todo-list"></ul>
      <p class="empty-state" id="emptyState" hidden>표시할 할 일이 없습니다. 새로운 할 일을 추가해보세요!</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
